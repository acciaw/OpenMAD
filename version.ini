; Single source of truth for the app's identity.
;
; Read at runtime by src/mad68/version.py and at build time by
; packaging/mad68.iss, so the app, the installer and the update check can never
; disagree about which version they are.
;
; To cut a release: bump version here, rebuild, then tag the commit with the
; same number prefixed by v (for example v1.1.0).

[app]
name = OpenMAD
version = 1.1.2
repo = Acciaw/OpenMAD
publisher = Acciaw
url = https://github.com/Acciaw/OpenMAD
